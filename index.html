<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ABBAS AI PREDICTOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Анимация пульсирующего зеленого света для кнопки */
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5); }
            70% { box-shadow: 0 0 0 20px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .btn-pulse { animation: pulse-green 2s infinite; }

        /* Анимация сканера радара */
        @keyframes radar-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .radar-sweep {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: conic-gradient(from 0deg, transparent 70%, rgba(34, 197, 94, 0.4) 100%);
            transform-origin: 0 0;
            border-radius: 50%;
            animation: radar-spin 1.5s linear infinite;
            display: none; /* Скрыто по умолчанию */
            pointer-events: none;
        }

        /* Небольшая анимация для самого текста радара */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .analyzing-text {
            animation: blink 0.8s infinite;
            color: #fbbf24;
        }

        /* Стили для терминала с плавной прокруткой */
        .terminal-scroll {
            scrollbar-width: none; /* Firefox */
        }
        .terminal-scroll::-webkit-scrollbar {
            display: none; /* Chrome, Safari */
        }

        /* Задний фон-сетка для радара */
        .radar-grid {
            background-image: 
                linear-gradient(rgba(75, 85, 99, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(75, 85, 99, 0.3) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: center center;
        }

        body {
            background-color: #0b1120;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="text-white min-h-[100dvh] flex flex-col items-center justify-start pt-4 px-4 pb-32 font-sans relative">

    <!-- Фоновое свечение -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-64 bg-blue-500 opacity-5 blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-sm mx-auto flex flex-col items-center gap-6 relative z-10 pt-4">
        
        <!-- Верхний статус бар (Поднятие реалистичности) -->
        <div class="w-full flex justify-between items-center text-[10px] font-mono text-gray-400 px-2 border-b border-gray-800 pb-2">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_#22c55e]"></div>
                <span class="tracking-widest">SERVER: ONLINE</span>
            </div>
            <div class="flex items-center gap-4">
                <span>USERS: <span class="text-white">1,402</span></span>
                <span>PING: <span id="pingValue" class="text-green-400">24</span>ms</span>
            </div>
        </div>

        <!-- Шапка -->
        <div class="text-center w-full mb-4">
            <div class="flex items-center justify-center gap-3 mb-2">
                <h1 class="text-3xl font-black tracking-tight text-gray-100 drop-shadow-md leading-none">
                    ABBAS AI <br/> <span class="text-2xl text-blue-400">PREDICTOR</span>
                </h1>
                <span class="text-5xl drop-shadow-lg">🇮🇶</span>
            </div>
            
            <!-- Плашки с технической информацией -->
            <div class="flex justify-center gap-2 mt-4">
                <div class="bg-gray-800/80 border border-gray-700 px-2 py-1 rounded text-[10px] font-mono text-gray-300">
                    MODEL: <span class="text-blue-400">NEURAL-V7</span>
                </div>
                <div class="bg-gray-800/80 border border-gray-700 px-2 py-1 rounded text-[10px] font-mono text-gray-300">
                    ACCURACY: <span class="text-green-400">98.4%</span>
                </div>
            </div>
        </div>

        <!-- Экран вывода коэффициента (Радар) -->
        <div class="w-full flex justify-center mb-6 mt-2">
            <div class="relative w-56 h-56 bg-gray-900 rounded-full flex items-center justify-center border-4 border-gray-700 shadow-[0_0_30px_rgba(0,0,0,0.5)] overflow-hidden radar-grid">
                
                <!-- Декоративные кольца и оси -->
                <div class="absolute inset-0 rounded-full border border-gray-700 opacity-30 m-4 pointer-events-none"></div>
                <div class="absolute inset-0 rounded-full border border-gray-700 opacity-20 m-10 pointer-events-none"></div>
                <div class="absolute w-full h-[1px] bg-gray-700/50 top-1/2 -translate-y-1/2 pointer-events-none"></div>
                <div class="absolute h-full w-[1px] bg-gray-700/50 left-1/2 -translate-x-1/2 pointer-events-none"></div>
                
                <!-- Луч радара (скрыт, пока не нажмут кнопку) -->
                <div id="radarSweep" class="radar-sweep"></div>
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3 h-3 bg-green-500 rounded-full shadow-[0_0_10px_#22c55e] z-10 opacity-50"></div>

                <!-- Само значение -->
                <div id="displayElement" class="text-5xl font-black text-gray-500 tracking-tighter drop-shadow-lg z-20 transition-all duration-300 bg-gray-900/60 px-4 py-2 rounded-xl backdrop-blur-sm">
                    --.--X
                </div>
            </div>
        </div>

        <!-- Живой Терминал (Консоль) -->
        <div class="w-full px-2 mb-4">
            <div class="w-full bg-[#0a0a0a] border border-gray-800 rounded-lg h-24 relative overflow-hidden flex flex-col shadow-inner">
                <div class="bg-gray-800 w-full px-2 py-1 flex justify-between items-center text-[9px] font-mono text-gray-400 uppercase">
                    <span>System Terminal</span>
                    <span>root@abbas-ai:~</span>
                </div>
                <div id="terminalBody" class="p-2 text-[11px] font-mono text-green-500 flex-1 overflow-y-auto terminal-scroll flex flex-col justify-end">
                    <div class="opacity-70">> System ready. Waiting for initialization...</div>
                </div>
            </div>
        </div>

        <!-- История предыдущих сигналов -->
        <div class="w-full px-2">
            <div class="text-[10px] text-gray-500 mb-2 font-mono uppercase tracking-wider text-center flex items-center justify-center gap-2">
                <div class="h-[1px] bg-gray-800 flex-1"></div>
                <span>Recent History</span>
                <div class="h-[1px] bg-gray-800 flex-1"></div>
            </div>
            <div id="historyContainer" class="flex justify-center gap-2 font-mono text-sm font-bold">
                <span class="bg-gray-800/80 border border-gray-700 px-3 py-1 rounded text-red-400">1.12X</span>
                <span class="bg-gray-800/80 border border-gray-700 px-3 py-1 rounded text-green-400">3.84X</span>
                <span class="bg-gray-800/80 border border-gray-700 px-3 py-1 rounded text-yellow-400">5.10X</span>
            </div>
        </div>

    </div>

    <!-- Кнопка генерации сигнала (Фиксированная внизу экрана) -->
    <div class="fixed bottom-0 left-0 w-full px-4 pb-[max(1.5rem,env(safe-area-inset-bottom))] pt-8 bg-gradient-to-t from-[#0b1120] via-[#0b1120] to-transparent z-50 pointer-events-none">
        <div class="max-w-sm mx-auto w-full pointer-events-auto">
            <button id="generateBtn" class="w-full bg-green-500 hover:bg-green-400 active:bg-green-600 text-white font-black text-xl py-4 rounded-2xl transition-all btn-pulse uppercase tracking-wider shadow-[0_0_20px_rgba(34,197,94,0.3)] flex items-center justify-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"></path><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                GENERATE SIGNAL
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('generateBtn');
            const display = document.getElementById('displayElement');
            const radarSweep = document.getElementById('radarSweep');
            const terminalBody = document.getElementById('terminalBody');
            const historyContainer = document.getElementById('historyContainer');
            const pingValue = document.getElementById('pingValue');
            
            let isAnalyzing = false;

            // Функция для генерации случайного коэффициента с заданными вероятностями
            function getRandomSignal() {
                const rand = Math.random();
                let result;
                
                if (rand < 0.70) {
                    // 70% шанс: между 1.1X и 1.6X
                    result = 1.1 + Math.random() * (1.6 - 1.1);
                } else if (rand < 0.90) {
                    // 20% шанс: между 1.7X и 2.1X
                    result = 1.7 + Math.random() * (2.1 - 1.7);
                } else {
                    // 10% шанс: между 2.2X и 5.0X
                    result = 2.2 + Math.random() * (5.0 - 2.2);
                }
                
                return result.toFixed(2) + 'X';
            }

            // Динамическое изменение пинга для реалистичности
            setInterval(() => {
                const basePing = 20;
                const randomVariation = Math.floor(Math.random() * 15) - 5;
                pingValue.textContent = basePing + randomVariation;
            }, 3000);

            // Фейковые логи для терминала
            const terminalLogs = [
                "[SYSTEM] Bypassing hash protection...",
                "[NETWORK] Connecting to provider API...",
                "[NEURAL] Analyzing previous 5,000 seeds...",
                "[MATH] Calculating crash point probability...",
                "[SUCCESS] Signal decrypted successfully."
            ];

            btn.addEventListener('click', () => {
                if (isAnalyzing) return;
                isAnalyzing = true;
                
                // Визуальное отключение кнопки
                btn.classList.remove('btn-pulse', 'bg-green-500', 'hover:bg-green-400');
                btn.classList.add('bg-gray-700', 'cursor-not-allowed', 'opacity-80', 'shadow-none');
                
                // Отображение процесса на радаре
                display.classList.remove('text-green-400', 'text-gray-500', 'text-5xl', 'text-6xl');
                display.classList.add('analyzing-text', 'text-3xl');
                display.textContent = 'analyzing...';
                
                // Включаем луч радара
                radarSweep.style.display = 'block';

                // Очищаем терминал
                terminalBody.innerHTML = '';
                
                // Запускаем имитацию вывода в консоль
                let logIndex = 0;
                const logInterval = setInterval(() => {
                    if (logIndex < terminalLogs.length) {
                        const p = document.createElement('div');
                        p.textContent = `> ${terminalLogs[logIndex]}`;
                        terminalBody.appendChild(p);
                        terminalBody.scrollTop = terminalBody.scrollHeight; // Прокрутка вниз
                        logIndex++;
                    } else {
                        clearInterval(logInterval);
                    }
                }, 350); // 5 логов * 350мс = ~1750мс

                // Ждем 2 секунды (2000 мс) как просили
                setTimeout(() => {
                    clearInterval(logInterval);
                    
                    // Восстанавливаем кнопку
                    btn.classList.remove('bg-gray-700', 'cursor-not-allowed', 'opacity-80', 'shadow-none');
                    btn.classList.add('btn-pulse', 'bg-green-500', 'hover:bg-green-400');
                    
                    // Отключаем луч радара
                    radarSweep.style.display = 'none';

                    // Получаем результат на основе вероятностей
                    const result = getRandomSignal();
                    
                    // Меняем текст на результат
                    display.classList.remove('analyzing-text', 'text-3xl');
                    display.classList.add('text-green-400', 'text-6xl');
                    display.textContent = result;

                    // Добавляем этот результат в историю
                    updateHistory(result);

                    // Выводим финальный лог
                    const p = document.createElement('div');
                    p.innerHTML = `> <span class="text-white bg-green-600 px-1">TARGET ACQUIRED: ${result}</span>`;
                    terminalBody.appendChild(p);
                    terminalBody.scrollTop = terminalBody.scrollHeight;
                    
                    isAnalyzing = false;
                }, 2000);
            });

            // Функция для обновления строки истории (добавляет новый сигнал, удаляет старый)
            function updateHistory(newResult) {
                // Создаем новый элемент спан
                const newSpan = document.createElement('span');
                newSpan.className = 'bg-gray-800/80 border border-green-500/50 px-3 py-1 rounded text-green-400 shadow-[0_0_10px_rgba(34,197,94,0.2)] transition-all animate-pulse';
                newSpan.textContent = newResult;

                // Добавляем в начало контейнера
                historyContainer.insertBefore(newSpan, historyContainer.firstChild);

                // Удаляем анимацию пульсации через секунду
                setTimeout(() => {
                    newSpan.classList.remove('animate-pulse', 'border-green-500/50', 'shadow-[0_0_10px_rgba(34,197,94,0.2)]');
                    newSpan.classList.add('border-gray-700');
                }, 1500);

                // Если элементов больше 4-х, удаляем самый старый (последний)
                if (historyContainer.children.length > 4) {
                    historyContainer.removeChild(historyContainer.lastChild);
                }
            }
        });
    </script>
</body>
</html>
